version: '3.8'

services:
  # Aplikasi Laravel (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: presensi_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - presensi-network

  # Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: presensi_web
    restart: unless-stopped
    ports:
      - "8093:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - presensi-network
    depends_on:
      - app

  # Database (MySQL)
  db:
    image: mysql:8.0
    container_name: presensi_db
    restart: unless-stopped
    tty: true
    ports:
      - "3040:3306"
    environment:
      MYSQL_DATABASE: absensi_db
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_PASSWORD: secretpassword
      MYSQL_USER: presensi_user
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - presensi-network

networks:
  presensi-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
